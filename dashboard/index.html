<title>LIMITLESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: glass command rail on the left (bottom dock on phones) + module stage; the Brain opens with a live 3D neural core. Dark-first. */
:root{
  --void:#05060d; --deck:#0b0e1d; --deck-2:#11152b; --edge:#20274a; --text:#eef0ff; --dim:#8a92c4;
  --ion:#5de4ff; --plasma:#b48cff; --flare:#ff7ad9; --ion-soft:rgba(93,228,255,.12); --plasma-soft:rgba(180,140,255,.14);
  --ok:#43e6a0; --ok-soft:rgba(67,230,160,.13); --warn:#ffc65c; --warn-soft:rgba(255,198,92,.13); --bad:#ff6b8b; --bad-soft:rgba(255,107,139,.13);
  --glass:rgba(17,21,43,.62); --grid:rgba(93,228,255,.06);
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Sora",system-ui,sans-serif; --f-data:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --void:#eceefb; --deck:#ffffff; --deck-2:#f3f4fd; --edge:#d7daf1; --text:#11142f; --dim:#5a618f;
  --ion:#0086b0; --plasma:#6a3fd6; --flare:#c2268f; --ion-soft:rgba(0,134,176,.10); --plasma-soft:rgba(106,63,214,.10);
  --ok:#0f8f5c; --ok-soft:rgba(15,143,92,.12); --warn:#a76a00; --warn-soft:rgba(167,106,0,.12); --bad:#c42b4f; --bad-soft:rgba(196,43,79,.10);
  --glass:rgba(255,255,255,.72); --grid:rgba(0,134,176,.07); color-scheme:light}}
:root[data-theme="light"]{
  --void:#eceefb; --deck:#ffffff; --deck-2:#f3f4fd; --edge:#d7daf1; --text:#11142f; --dim:#5a618f;
  --ion:#0086b0; --plasma:#6a3fd6; --flare:#c2268f; --ion-soft:rgba(0,134,176,.10); --plasma-soft:rgba(106,63,214,.10);
  --ok:#0f8f5c; --ok-soft:rgba(15,143,92,.12); --warn:#a76a00; --warn-soft:rgba(167,106,0,.12); --bad:#c42b4f; --bad-soft:rgba(196,43,79,.10);
  --glass:rgba(255,255,255,.72); --grid:rgba(0,134,176,.07); color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1100px 620px at 88% -12%,var(--plasma-soft),transparent 60%),radial-gradient(900px 520px at -8% 108%,var(--ion-soft),transparent 60%),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;border-right:1px solid var(--edge);display:flex;flex-direction:column;gap:3px;background:var(--glass);backdrop-filter:blur(16px) saturate(140%)}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.2em;padding:4px 10px 4px}
.brand b{background:linear-gradient(90deg,var(--ion),var(--plasma),var(--flare));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:var(--f-data);font-size:10.5px;letter-spacing:.18em;color:var(--dim);padding:0 10px 18px;text-transform:uppercase}
nav.rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--dim);text-decoration:none;font-size:14px;font-weight:500;transition:background .2s,color .2s}
nav.rail a:hover{color:var(--text);background:var(--deck-2)}
nav.rail a[aria-current="page"]{color:var(--text);background:linear-gradient(90deg,var(--ion-soft),transparent);box-shadow:inset 2px 0 0 var(--ion)}
nav.rail a i{font-style:normal;font-family:var(--f-data);font-size:10.5px;width:22px;color:var(--ion)}
nav.rail .sp{flex:1}
.who{font-size:12px;color:var(--dim);padding:10px;border-top:1px solid var(--edge);display:flex;gap:8px;align-items:center}
.who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}
main{padding-inline:30px;padding-block:26px 96px;max-width:1260px;width:100%;display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,34px);margin:0;letter-spacing:.01em;text-wrap:balance}
.kicker{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ion)}
.sub{color:var(--dim);font-size:13.5px}
h2{font-family:var(--f-data);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:600}
.panel{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:18px;padding:18px;min-width:0}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
/* brain */
.brain{position:relative;overflow:hidden;padding:0;height:min(460px,62vw);min-height:320px;border-radius:22px;border:1px solid var(--edge);
  background:radial-gradient(60% 80% at 65% 50%,var(--plasma-soft),transparent 70%),var(--deck)}
.brain::after{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;background:linear-gradient(120deg,var(--ion),transparent 30%,transparent 70%,var(--plasma));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}
.brain canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.brain .ov{position:absolute;left:0;top:0;padding:22px 24px;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:400px}
.brain .ov b{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.6vw,28px);line-height:1.2}
.brain .ov .stats{display:flex;gap:18px;margin-top:6px;font-family:var(--f-data);font-size:12px;color:var(--dim)}
.brain .ov .stats b{font-size:20px;color:var(--text);display:block;font-family:var(--f-data)}
.brain .hint{position:absolute;right:16px;bottom:12px;font-family:var(--f-data);font-size:11px;color:var(--dim)}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.agent{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--edge);border-radius:14px;background:var(--glass);min-width:0;transition:border-color .2s,transform .2s}
.agent:hover{border-color:var(--ion);transform:translateY(-1px)}
.agent .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--plasma)}
.agent .dot.on{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.agent .dot.wait{background:var(--warn)}
.agent b{font-size:14px;display:block}
.agent span{font-size:12.5px;color:var(--dim);overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--edge);border-radius:16px;background:var(--glass);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--ion),var(--plasma));opacity:.8}
.kpi small{color:var(--dim);font-size:12.5px}
.kpi b{font-family:var(--f-data);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--edge);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ion),var(--plasma))}
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;position:relative}
.st{padding:10px 6px;border:1px solid var(--edge);border-radius:12px;text-align:center;background:var(--glass);min-width:0}
.st b{display:block;font-family:var(--f-data);font-size:20px}
.st span{font-size:11px;color:var(--dim);overflow-wrap:anywhere;font-family:var(--f-data);letter-spacing:.04em}
.st.on{border-color:var(--ion);background:var(--ion-soft);box-shadow:0 0 24px -10px var(--ion)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.card{border:1px solid var(--edge);border-radius:16px;background:var(--glass);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--dim)}
.row b{color:var(--text);font-family:var(--f-data);font-weight:400}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;font-family:var(--f-data);letter-spacing:.03em}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-ion{background:var(--ion-soft);color:var(--ion)}.c-pl{background:var(--plasma-soft);color:var(--plasma)}
.score{display:flex;align-items:center;gap:10px}.score .bar{flex:1;margin:0}.score b{font-family:var(--f-data);font-size:22px;min-width:3ch;text-align:right}
.crit{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.crit button{height:26px;border-radius:7px;border:1px solid var(--edge);background:transparent;color:var(--dim);font-family:var(--f-data);font-size:11px;cursor:pointer;padding:0}
.crit button.y{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.crit button.n{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.crit button:disabled{cursor:default}
.tbl{overflow-x:auto;border:1px solid var(--edge);border-radius:16px;background:var(--glass)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--edge);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;font-family:var(--f-data)}
td.n{font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
a{color:var(--ion)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--deck-2);border:1px solid var(--edge);border-radius:10px;padding:9px 10px;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--ion);background:var(--ion-soft);color:var(--text)}
.btn.solid{background:linear-gradient(90deg,var(--ion),var(--plasma));color:#05060d;border:0;box-shadow:0 8px 28px -10px var(--plasma)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--dim);font-size:13px}
.empty{border:1px dashed var(--edge);border-radius:16px;padding:22px;color:var(--dim);font-size:14px;display:flex;flex-direction:column;gap:6px;background:var(--glass)}
.empty b{color:var(--text);font-family:var(--f-display);font-weight:600;font-size:15px}
.ai{border:1px solid var(--plasma);background:var(--plasma-soft);border-radius:12px;padding:12px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mod{border:1px solid var(--edge);border-radius:16px;padding:16px;background:var(--glass);display:flex;flex-direction:column;gap:6px}
.mod b{font-family:var(--f-display);font-weight:600;font-size:15px}
.rules{padding-left:18px;margin:0;columns:2 380px;column-gap:28px}
.rules li{margin-bottom:8px;font-size:14px;break-inside:avoid}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--edge);z-index:5}
  nav.rail .brand,nav.rail .tag,nav.rail .sp,.who{display:none}
  nav.rail a{flex:none;flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
  main{padding-inline:16px;padding-block:18px 116px}
  .flow{grid-template-columns:repeat(4,minmax(0,1fr))}
  .brain .ov{max-width:100%}
}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.cat{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.cathead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-top:6px;border-top:1px solid var(--edge)}
.catt{font-family:var(--f-display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--text);margin:0}
.prodblock{border:1px solid var(--edge);border-radius:18px;background:var(--glass);padding:14px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.ph h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px}
.ph .dot{width:8px;height:8px;border-radius:50%;background:var(--ion);box-shadow:0 0 10px var(--ion)}
.ph .btn{margin-left:auto;padding:6px 12px;font-size:12.5px}
.vrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.step::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:linear-gradient(var(--ion),var(--plasma));opacity:.4}
.step:last-child::before{display:none}
.step .num{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;border:1px solid var(--ion);background:var(--ion-soft);color:var(--text)}
.step.done .num{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step .sb{border:1px solid var(--edge);border-radius:16px;background:var(--glass);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.step h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px}
.step p{margin:0;color:var(--dim);max-width:70ch}
.step a.btn{text-decoration:none}
.calcout{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);font-size:14px}
.calcout.good{border-color:var(--ok);background:var(--ok-soft)}.calcout.bad{border-color:var(--bad);background:var(--bad-soft)}
.take summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:12px}
.take summary::-webkit-details-marker{display:none}
.take dl{margin:6px 0 0;display:grid;gap:2px;font-size:12px}
.take dt{color:var(--ion);font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.take dd{margin:0;color:var(--text)}
.toplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.topc{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;border:1px solid var(--edge);border-radius:18px;background:var(--glass);padding:16px}
.topc.start{border-color:var(--ion)}.topc.ok{border-color:var(--ok);box-shadow:0 0 30px -16px var(--ok)}
.topc .rk{font-family:var(--f-display);font-weight:800;font-size:30px;background:linear-gradient(180deg,var(--ion),var(--plasma));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.topc h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.topc p{margin:4px 0;max-width:80ch}
.topc a.btn{text-decoration:none}
.tb{display:flex;flex-direction:column;gap:6px;min-width:0}
.lane{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;border:1px solid var(--edge);border-radius:20px;background:var(--glass);padding:14px;min-width:0}
.lside{display:flex;flex-direction:column;gap:8px;min-width:0}
.lside h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px}
.lside .cap{margin:0;font-size:13px;color:var(--text)}
.lside .vid{max-width:220px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12px}.meta dt{color:var(--dim)}.meta dd{margin:0;text-align:right;font-family:var(--f-data)}
.lgroups{display:flex;flex-direction:column;gap:12px;min-width:0}
.ghead{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.gdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.shot{flex:none;width:280px;border:1px solid var(--edge);border-top:3px solid var(--gc);border-radius:14px;background:var(--deck);padding:12px;display:flex;flex-direction:column;gap:6px}
.shot h4{margin:0;font-size:14px}.shot p{margin:0;font-size:12.5px}
.sid{font-family:var(--f-data);font-size:12px;color:var(--ion)}
.mono{font-family:var(--f-data);font-size:11px}
.pr summary{cursor:pointer;font-size:12.5px;color:var(--ion)}
.pblk{border-top:1px solid var(--edge);padding-top:6px;margin-top:6px}
.pblk pre{white-space:pre-wrap;font-family:var(--f-data);font-size:11px;max-height:220px;overflow:auto;background:var(--deck-2);border-radius:8px;padding:8px;margin:4px 0 0}
@media (max-width:860px){.lane{grid-template-columns:1fr}.lside .vid{max-width:200px}}
.insight{border:1px solid var(--plasma);border-radius:12px;background:var(--plasma-soft);padding:10px 12px;margin-bottom:10px}
.insight summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.insight summary::-webkit-details-marker{display:none}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px}
.ins h4{margin:0 0 4px;font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--plasma)}
.ins p,.ins li{font-size:13.5px;margin:0 0 4px}.ins ul{margin:0;padding-left:18px}
.broll{margin-top:14px;border-top:1px solid var(--edge);padding-top:10px}.broll h4{margin:0 0 4px;font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--plasma)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:8px 0}.shot{background:var(--deck-2);border:1px solid var(--edge);border-radius:12px;padding:10px}.shot p{font-size:13px;margin:6px 0}.shot .vid.ref{max-width:150px}
.exact{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:10px 0 8px;font-size:14px}
.tog{flex-direction:row;align-items:center;gap:6px;color:var(--text);font-size:13px}
.verdict{font-size:13px;border-radius:10px;padding:8px 12px;margin-bottom:12px;border:1px solid var(--edge)}
.verdict.v-ok{border-color:var(--ok);background:var(--ok-soft)}.verdict.v-warn{border-color:var(--warn);background:var(--warn-soft)}.verdict.v-bad{border-color:var(--bad);background:var(--bad-soft)}
.link{font:inherit;font-size:12.5px;background:none;border:0;color:var(--ion);cursor:pointer;text-decoration:underline;padding:0 0 0 6px}
.acct{flex:none;width:200px;scroll-snap-align:start;border:1px solid var(--edge);border-radius:14px;background:var(--deck);padding:10px;display:flex;flex-direction:column;gap:6px}
.acct header{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.acct header a{color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .vt{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 3D neural core (three.js) ---------- */
const NET={alive:false,raf:0,
  stop(){cancelAnimationFrame(this.raf);this.alive=false;if(this.r){this.r.dispose();this.r=null}},
  refresh(){if(this.nodes)this.nodes.forEach(n=>{const on=S.agents[n.k]?.stare==="activ";n.mesh.material.color.set(on?this.c.ok:this.c.pl);n.halo.material.opacity=on?.55:.25})},
  start(cv){
    this.stop();if(!cv)return;
    if(!window.THREE){cv.parentElement.querySelector(".hint").textContent="";return}
    const css=getComputedStyle(document.documentElement),g=n=>css.getPropertyValue(n).trim();
    this.c={ion:g("--ion"),pl:g("--plasma"),ok:g("--ok"),fl:g("--flare"),edge:g("--edge"),txt:g("--dim")};
    const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});this.r=r;r.setPixelRatio(Math.min(devicePixelRatio,2));
    const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.set(0,1.6,9);
    const root=new THREE.Group();scene.add(root);
    const wide=()=>cv.clientWidth>700;
    const fit=()=>{const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();root.position.x=wide()?1.8:0;root.position.y=wide()?0:-.6};
    fit();this._fit=fit;addEventListener("resize",fit);
    // core: wire icosahedron + point cloud shell
    const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,2),new THREE.MeshBasicMaterial({color:this.c.pl,wireframe:true,transparent:true,opacity:.55}));root.add(core);
    const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(.55,1),new THREE.MeshBasicMaterial({color:this.c.ion,transparent:true,opacity:.85}));root.add(inner);
    const pts=new THREE.BufferGeometry(),P=[];for(let i=0;i<900;i++){const u=Math.random()*2-1,t=Math.random()*Math.PI*2,rr=1.6+Math.random()*1.4,s=Math.sqrt(1-u*u);P.push(rr*s*Math.cos(t),rr*u*.7,rr*s*Math.sin(t))}
    pts.setAttribute("position",new THREE.Float32BufferAttribute(P,3));const cloud=new THREE.Points(pts,new THREE.PointsMaterial({color:this.c.ion,size:.025,transparent:true,opacity:.6}));root.add(cloud);
    // agent ring
    const R=3.1,ring=new THREE.Mesh(new THREE.TorusGeometry(R,.006,8,200),new THREE.MeshBasicMaterial({color:this.c.ion,transparent:true,opacity:.35}));ring.rotation.x=Math.PI/2;root.add(ring);
    this.nodes=AGENTI.map(([k,n],i)=>{const a=i/AGENTI.length*Math.PI*2,pos=new THREE.Vector3(Math.cos(a)*R,Math.sin(a*2)*.25,Math.sin(a)*R);
      const on=S.agents[k]?.stare==="activ";
      const mesh=new THREE.Mesh(new THREE.SphereGeometry(.13,20,20),new THREE.MeshBasicMaterial({color:on?this.c.ok:this.c.pl}));mesh.position.copy(pos);root.add(mesh);
      const halo=new THREE.Mesh(new THREE.SphereGeometry(.3,20,20),new THREE.MeshBasicMaterial({color:this.c.ion,transparent:true,opacity:on?.55:.25,blending:THREE.AdditiveBlending,depthWrite:false}));halo.position.copy(pos);root.add(halo);
      const lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),pos]);root.add(new THREE.Line(lg,new THREE.LineBasicMaterial({color:this.c.pl,transparent:true,opacity:.28})));
      // label sprite
      const c2=document.createElement("canvas");c2.width=512;c2.height=128;const x=c2.getContext("2d");x.font="600 54px JetBrains Mono, monospace";x.fillStyle=this.c.txt;x.textAlign="center";x.fillText(n.toUpperCase(),256,80);
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c2),transparent:true,depthWrite:false}));sp.scale.set(1.3,.33,1);sp.position.copy(pos).add(new THREE.Vector3(0,.42,0));root.add(sp);
      return{k,mesh,halo,pos}});
    // pulses travelling agent → agent along the ring
    const pulses=[];const pg=new THREE.SphereGeometry(.06,12,12);
    const spawn=()=>{const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:this.c.fl,transparent:true,blending:THREE.AdditiveBlending}));root.add(m);pulses.push({m,i:0,p:0})};
    // drag to rotate
    let drag=null,vy=still?0:.0025,rx=.18;
    cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
    cv.addEventListener("pointermove",e=>{if(!drag)return;root.rotation.y+=(e.clientX-drag.x)*.006;rx=Math.max(-.6,Math.min(.8,rx+(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY}});
    cv.addEventListener("pointerup",()=>drag=null);cv.style.cursor="grab";cv.style.touchAction="pan-y";
    let t=0;this.alive=true;
    const tick=()=>{t++;if(!drag)root.rotation.y+=vy;root.rotation.x+=(rx-root.rotation.x)*.05;
      core.rotation.y-=.004;core.rotation.x+=.002;inner.scale.setScalar(1+Math.sin(t/25)*.06);cloud.rotation.y+=.0008;
      if(!still&&t%55===0)spawn();
      for(const q of pulses){q.p+=.012;if(q.p>=1){q.p=0;q.i++}const a=this.nodes[q.i%this.nodes.length].pos,b=this.nodes[(q.i+1)%this.nodes.length].pos;q.m.position.lerpVectors(a,b,q.p)}
      for(let j=pulses.length-1;j>=0;j--)if(pulses[j].i>=this.nodes.length){root.remove(pulses[j].m);pulses.splice(j,1)}
      this.nodes.forEach((n,i)=>n.halo.scale.setScalar(1+Math.sin(t/20+i)*.15));
      r.render(scene,cam);if(!still)this.raf=requestAnimationFrame(tick)};
    tick();
  }};

      ${L.cats.map(c=>`<details open><summary><span>${esc(c.name)}</span><small>${c.fams.length}</small></summary><ul>${c.fams.map(fm=>{const I=S.insights[fm.f._id];const v=I?(/^run/i.test(I.verdict||"")?"ok":/^skip/i.test(I.verdict||"")?"bad":"warn"):"none";return `<li><button class="bo" data-act="bgo" data-fam="${esc(fm.f._id)}" data-h="${esc(fm.f.title.toLowerCase())}"><i class="vdot v-${v}" aria-hidden="true"></i><span>${esc(fm.f.title)}</span><small>${fm.gs.reduce((n,g)=>n+g.list.length,0)}</small></button></li>`}).join("")}</ul></details>`).join("")}</nav>

const BOARD={v:null,L:null,
  mount(){const vp=document.getElementById("vp"),w=document.getElementById("world");if(!vp||!w)return;this.vp=vp;this.w=w;
    if(!this.v){const k=Math.min(.9,Math.max(.25,(vp.clientWidth-280)/1500));this.v={x:S.boutOpen===false?20:290,y:10,k}}this.apply();
    if(vp._m)return;vp._m=1;const P=new Map();let drag=null,moved=0,pinch=null;
    vp.addEventListener("pointerdown",e=>{if(e.target.closest(".bzoom,.bdrawer,input,select,button,textarea"))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(P.size===1){drag={x:e.clientX,y:e.clientY,vx:this.v.x,vy:this.v.y};moved=0}
      if(P.size===2){const [a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:this.v.k,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};drag=null}});
    vp.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pinch&&P.size===2){const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);this.zoomAt(pinch.k*d/pinch.d,pinch.cx,pinch.cy);moved=9;return}
      if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){moved=Math.abs(dx)+Math.abs(dy);vp.classList.add("dragging");try{vp.setPointerCapture(e.pointerId)}catch(_){}}
        if(moved>4){this.v.x=drag.vx+dx;this.v.y=drag.vy+dy;this.apply()}}});
    const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(!P.size){drag=null;vp.classList.remove("dragging")}};
    vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
    vp.addEventListener("click",e=>{if(moved>4){e.preventDefault();e.stopPropagation();moved=0;return}
      if(this.v.k<.42){const f=e.target.closest(".bfam");if(f&&!e.target.closest(".bout")){e.preventDefault();e.stopPropagation();this.fly(f,.62)}}},true);
    vp.addEventListener("wheel",e=>{if(e.target.closest(".bdrawer"))return;e.preventDefault();const r=vp.getBoundingClientRect();
      if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>=40&&!e.shiftKey&&e.deltaMode!==0||!e.shiftKey&&Math.abs(e.deltaX)<1&&Math.abs(e.deltaY)>=50){this.zoomAt(this.v.k*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top)}
      else{this.v.x-=e.deltaX;this.v.y-=e.deltaY;this.apply()}},{passive:false});
    document.addEventListener("keydown",e=>{if(S.route!=="finder"||S.fmode==="list"||e.target.closest?.("input,textarea,select"))return;
      if(e.key==="+"||e.key==="=")this.step(1.25);else if(e.key==="-")this.step(.8);else if(e.key==="0")this.fit();else if(e.key==="1")this.home();else if(e.key.startsWith("Arrow")){const d=120;if(e.key==="ArrowLeft")this.v.x+=d;if(e.key==="ArrowRight")this.v.x-=d;if(e.key==="ArrowUp")this.v.y+=d;if(e.key==="ArrowDown")this.v.y-=d;e.preventDefault();this.apply()}});
  },
  apply(){if(this._raf)return;this._raf=requestAnimationFrame(()=>{this._raf=0;this._apply()})},
  _apply(){if(!this.w)return;const v=this.v;this.w.classList.add("moving");clearTimeout(this._mt);this._mt=setTimeout(()=>this.w&&this.w.classList.remove("moving"),180);this.w.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.k})`;this.w.style.setProperty("--inv",(1/v.k).toFixed(3));
    this.vp.classList.toggle("far",v.k<.42);this.vp.classList.toggle("vfar",v.k<.16);const z=document.getElementById("bzv");if(z)z.textContent=Math.round(v.k*100)+"%"},
  zoomAt(k,cx,cy){k=Math.max(.03,Math.min(2.5,k));const v=this.v;v.x=cx-(cx-v.x)*k/v.k;v.y=cy-(cy-v.y)*k/v.k;v.k=k;this.apply()},
  step(f){const r=this.vp.getBoundingClientRect();this.zoomAt(this.v.k*f,r.width/2,r.height/2)},
  fit(){const r=this.vp.getBoundingClientRect(),L=this.L;const k=Math.min(r.width/(L.w+80),r.height/(L.h+80));this.v={x:(r.width-L.w*k)/2,y:20,k};this.apply()},
  home(){const k=Math.min(1,Math.max(.25,this.vp.clientWidth/1500));this.v={x:20,y:10,k};this.apply()},
  fly(el,k){if(!el||!this.vp)return;const r=this.vp.getBoundingClientRect();k=k||Math.max(this.v.k,.55);const x=el.offsetLeft+(el.offsetParent&&el.offsetParent!==this.w?el.offsetParent.offsetLeft:0),y=el.offsetTop+(el.offsetParent&&el.offsetParent!==this.w?el.offsetParent.offsetTop:0);
    const ol=(document.getElementById("bout")&&!document.getElementById("bout").hidden)?280:0;this.w.classList.add("anim");this.v={x:ol+(r.width-ol)/2-(x+Math.min(el.offsetWidth,(r.width-ol)/k)/2)*k,y:60-y*k,k};this.apply();setTimeout(()=>this.w.classList.remove("anim"),500)},
  search(q){q=(q||"").trim().toLowerCase();const vp=this.vp;if(!vp)return;vp.classList.toggle("searching",!!q);let first=null;
    vp.querySelectorAll(".bfam").forEach(f=>{const famHit=q&&f.dataset.h.includes(q);let any=false;f.querySelectorAll(".bcard").forEach(c=>{const hit=!!q&&(famHit||c.dataset.h.includes(q.replace(/^@/,"")));c.classList.toggle("hit",hit);if(hit)any=true});f.classList.toggle("hit",famHit||any);if(!first&&(famHit||any))first=f});
    document.querySelectorAll("#bout .bo").forEach(b=>{b.closest("li").hidden=!!q&&!(document.getElementById("bf-"+b.dataset.fam)?.classList.contains("hit"))});
    if(first)this.fly(first)},
  drawer(html){const d=document.getElementById("bdrawer");if(!d)return;document.getElementById("bdc").innerHTML=html;d.hidden=false;d.scrollTop=0}
};
function famDetail(id){const f=S.finder.find(x=>x._id===id);if(!f)return "";const vd=brainVerdict(f);
  return `<span class="kicker">${esc(f.group)}</span><h2 class="dh">${esc(f.title)}</h2><p class="bfv v-${vd.k}">${esc(vd.t)}</p>${insightBlock(f).replace('<details class="insight">','<details class="insight" open>')||'<p class="muted">No analysis yet for this product.</p>'}
   ${S.write?`<button class="btn solid" data-act="tofind" data-id="${f._id}">Send to Products</button>`:""}`}
function acctDetail(fid,h){const f=S.finder.find(x=>x._id===fid);if(!f)return "";const g=groupsFor(f);let a=null,row=null;g.forEach(x=>x.list.forEach(y=>{if(y.handle===h){a=y;row=x}}));if(!a)return "";
  const k=S.takes[a.mkey];const href=a.top_video||a.url;
  return `<span class="kicker">${esc(f.title)} · ${esc(row?.title||"")}</span><h2 class="dh">@${esc(a.handle)}</h2>
   ${href?`<a class="vid big" href="${esc(href)}" target="_blank" rel="noopener" ${a.mkey?`data-poster="${esc(a.mkey)}"`:""}><span class="pl">▶</span><span class="wo">Watch the original post</span></a>`:""}
   <div class="bnums"><div><b>${fmt(a.followers)}</b><small>Followers</small></div><div><b>${fmt(a.avg_views)}</b><small>Avg views</small></div><div><b>${a.top_views?fmt(a.top_views):"–"}</b><small>Top video</small></div></div>
   <p>${a._ugc?chip("Real UGC","ok"):chip("Not real UGC","warn")} ${a.website?`<a href="${esc(a.website)}" target="_blank" rel="noopener">Open their store</a>`:""}</p>
   ${k?`<dl class="dl"><dt>Brain score</dt><dd>${esc(k.score)}/10 · ${esc(k.type||"")}</dd><dt>Hook</dt><dd>${esc(k.hook)}</dd><dt>On-screen text</dt><dd>${esc(k.text)}</dd><dt>Trigger</dt><dd>${esc(k.trigger)}</dd><dt>Beats</dt><dd>${esc((k.beats||[]).join(" → "))}</dd><dt>Why it works</dt><dd>${esc(k.why)}</dd><dt>Our remake</dt><dd>${esc(k.remake)}</dd><dt>Risk</dt><dd>${esc(k.risk)}</dd></dl>`:'<p class="muted">This video has not been analysed yet.</p>'}
   <button class="btn" data-act="bwhy" data-fam="${esc(fid)}">Why this product sells</button>`}
/* ---- The Brain chat: talk to the platform in your own words ---- */
const BOT={msgs:[],busy:false,ctl:null,
  load(){try{this.msgs=JSON.parse(localStorage.getItem("lx.chat")||"[]").slice(-40)}catch(e){this.msgs=[]}},
  save(){try{localStorage.setItem("lx.chat",JSON.stringify(this.msgs.slice(-40)))}catch(e){}},
  toggle(open){const p=$("#botp");if(!p)return;p.hidden=open===undefined?!p.hidden:!open;if(!p.hidden){this.draw();setTimeout(()=>$("#botin")?.focus(),50)}},
  draw(){const l=$("#botlog");if(!l)return;
    l.innerHTML=(this.msgs.length?this.msgs:[{role:"assistant",content:"Hi Szasz. Tell me what you need in your own words, in Romanian or English. I can explain any product, compare products, open pages, approve picks for you, and send real work (videos, research, suppliers) to Claude Code."}]).map(m=>`<div class="bm ${m.role==="user"?"me":"ai"}">${esc(m.content).replace(/\n/g,"<br>")}</div>`).join("")+(this.busy?`<div class="bm ai typing" id="bottyping">${esc(this.partial||"Thinking…")}</div>`:"");
    l.scrollTop=l.scrollHeight},
  ctx(){const top=(S.top?.items||[]).map((t,i)=>`${i+1}. ${t.title} [id ${t.id}]${S.top?.approved?.[t.id]?" (APPROVED)":""}`).join("\n");
    const rules=(S.cfg?.rules_en||[]).slice(-12).map(r=>"- "+r).join("\n");
    return `You are "the Brain", the assistant inside LIMITLESS, Szasz's organic dropshipping platform (find proven UGC virals, remake them with Higgsfield Genjutsu motion control / Seedance 2.5 / GPT Image 2.5, post organically, sell from one Shopify store). Szasz is not technical. Answer in the language he writes in (usually Romanian), short and plain, no jargon. Use the tools to look things up instead of guessing; never invent numbers. You can open pages and products, and approve or un-approve Top 10 picks when he clearly asks. Anything that needs real work (making videos, spending Higgsfield credits, research, supplier search, landing pages, code changes) goes to Claude Code with send_to_claude_code; tell him it was sent and that Claude Code will do it. Never spend money or credits yourself.
Current page: ${S.route}. Products in the finder: ${S.finder.length}. Rules (newest last):\n${rules}\nTop 10 picks:\n${top}`},
  tools(){const self=this;return [
    {name:"search_products",description:"Search the product finder by words (product, variation, account handle). Returns matching products with ids, numbers, verdicts.",inputSchema:{type:"object",properties:{q:{type:"string"}},required:["q"]},
      execute({q}){q=(q||"").toLowerCase();return S.finder.filter(f=>(f.title+" "+f.group+" "+f._id+" "+f.variations.map(v=>v.title+" "+v.accounts.map(a=>a.handle).join(" ")).join(" ")).toLowerCase().includes(q)).slice(0,8).map(f=>({id:f._id,title:f.title,category:f.group,best_avg_views:f.best_avg_views,accounts:f.accounts,verdict:S.insights[f._id]?.verdict||null,video_type:S.broll[f._id]?.type||null}))}},
    {name:"product_details",description:"Full analysis of one product by id: why it works, buyers, winning patterns, better videos, variations, concept upgrades, landing angle, risks, B-roll shots.",inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
      execute({id}){const f=S.finder.find(x=>x._id===id);if(!f)throw new Error("unknown product id");const B=S.broll[id];const shots=B?[...(B.family_recurring_shots||[]),...Object.values(B.rows||{}).flatMap(r=>r.recurring_shots||[])].map(s=>({name:s.name,videos:s.seen_in?.count,what:s.what_happens})):[];
        return {title:f.title,category:f.group,best_avg_views:f.best_avg_views,sellers:groupsFor(f).map(g=>({exact_product:g.title,accounts:g.list.length,ugc:g.list.filter(a=>a._ugc).length})),brain:brainVerdict(f).t,insight:S.insights[id]||null,video_type:B?.type||null,broll_shots:shots}}},
    {name:"open_page",description:"Open a page of the platform.",inputSchema:{type:"object",properties:{page:{type:"string",enum:Object.keys(VIEWS)}},required:["page"]},
      execute({page}){go(page);return "opened "+page}},
    {name:"show_product",description:"Open the product finder board and fly to one product.",inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
      execute({id}){S.fmode="board";go("finder");setTimeout(()=>{BOARD.fly(document.getElementById("bf-"+id));BOARD.drawer(famDetail(id))},120);return "shown"}},
    {name:"set_top10_approval",description:"Approve or un-approve a Top 10 pick by its id, only when Szasz clearly asks.",inputSchema:{type:"object",properties:{id:{type:"string"},approved:{type:"boolean"}},required:["id","approved"]},
      async execute({id,approved}){if(!S.db||!S.write)throw new Error("no write access");const ap={...((S.top||{}).approved||{})};if(approved)ap[id]=true;else delete ap[id];await S.db.doc("config/top10").update({approved:ap});return approved?"approved":"removed"}},
    {name:"send_to_claude_code",description:"Send a task to Claude Code (the builder) as a request in the inbox. Use for anything that needs real work or spending.",inputSchema:{type:"object",properties:{task:{type:"string",description:"The task, written clearly, in Szasz's words plus any detail you know"}},required:["task"]},
      async execute({task}){if(!S.db||!S.write)throw new Error("no write access");await S.db.collection("inbox").add({text:task,status:"nou",creat:nowIso(),via:"chat"});return "sent"}},
    {name:"list_requests",description:"See the latest requests sent to Claude Code and their answers.",inputSchema:{type:"object",properties:{}},
      execute(){return S.inbox.slice(0,8).map(r=>({text:r.text,status:r.status,answer:r.raspuns||null}))}}
  ]},
  async send(text){text=(text||"").trim();if(!text||this.busy)return;if(!S.sample){this.msgs.push({role:"user",content:text},{role:"assistant",content:"I can't think here: open this page in claude.ai, signed in, and allow it to ask Claude."});this.save();this.draw();return}
    this.msgs.push({role:"user",content:text});this.busy=true;this.partial="";this.draw();this.ctl=new AbortController();
    const convo=[{role:"user",content:this.ctx()+"\n\n(Conversation follows.)"},{role:"assistant",content:"Understood."},...this.msgs.slice(-16)];
    try{const r=await S.sample(convo,{modelTier:"default",cache:false,signal:this.ctl.signal,tools:this.tools(),onText:({text})=>{this.partial=text;const t=$("#bottyping");if(t){t.textContent=text;const l=$("#botlog");l.scrollTop=l.scrollHeight}}});
      this.msgs.push({role:"assistant",content:(r&&r.text)||this.partial||"(no answer)"})}
    catch(e){if(e?.code==="not_granted")this.msgs.push({role:"assistant",content:"I need permission to ask Claude. Allow it when the browser asks, then try again."});
      else if(e?.code==="rate_limited")this.msgs.push({role:"assistant",content:"Too many questions in a short time. Wait a minute and ask again."});
      else this.msgs.push({role:"assistant",content:(e?.text||this.partial||"")+(e?.name==="AbortError"?"":"\n(Something went wrong: "+(e?.message||e)+")")});report(e,"bot")}
    this.busy=false;this.partial="";this.save();this.draw()}
};

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;

  if(a==="bot"){e.stopImmediatePropagation();BOT.toggle();return}

},true);
let _bqT=0;document.addEventListener("input",e=>{if(e.target.id==="bq"){S.fq=e.target.value;clearTimeout(_bqT);_bqT=setTimeout(()=>BOARD.search(S.fq),250)}});

const POST={io:null,init(){const v=document.getElementById("view");if(!v)return;
  this.io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){this.fill(e.target);this.io.unobserve(e.target)}}),{rootMargin:"600px 0px"}):null;
  let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;this.scan()})}).observe(v,{childList:true,subtree:true});this.scan()},
 fill(el){const k=el.dataset.poster||el.dataset.pk,u=S.posters[k];if(!u)return;if(el.tagName==="VIDEO")el.poster=u;else el.style.backgroundImage=`url(${u})`},
 scan(){document.querySelectorAll("#view [data-poster]:not([data-pd]),#view video[data-pk]:not([data-pd])").forEach(el=>{if(!S.posters[el.dataset.poster||el.dataset.pk])return;el.dataset.pd="1";if(this.io)this.io.observe(el);else this.fill(el)})}};
POST.init();
