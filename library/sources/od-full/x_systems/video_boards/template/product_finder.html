vp.addEventListener('scroll',()=>{if(vp.scrollTop||vp.scrollLeft){vp.scrollTop=0;vp.scrollLeft=0}});let drag=null,pointers=new Map(),pinch=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,input,video,details'))return;tween=null;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.setPointerCapture(e.pointerId);if(pointers.size===2){let [a,b]=[...pointers.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y)};drag=null}else drag={px:e.clientX,py:e.clientY,x,y};vp.classList.add('dragging')});vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);zoom(d/pinch.dist,(a.x+b.x)/2,(a.y+b.y)/2);pinch.dist=d}else if(drag){x=drag.x+e.clientX-drag.px;y=drag.y+e.clientY-drag.py;schedule()}});function endPointer(e){pointers.delete(e.pointerId);drag=null;pinch=null;vp.classList.remove('dragging')}vp.addEventListener('pointerup',endPointer);vp.addEventListener('pointercancel',endPointer);vp.addEventListener('wheel',e=>{if(viewer.open)return;e.preventDefault();tween=null;if(e.ctrlKey||e.metaKey)zoom(Math.exp(-e.deltaY*.006),e.clientX,e.clientY);else{x-=e.deltaX;y-=e.deltaY;schedule()}},{passive:false});
$('#fit').onclick=showOverview;$('#home-top').onclick=home;function theme(){let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('pf.theme',dark?'dark':'light')}catch{}$('#theme').textContent=dark?'Light':'Dark'}$('#theme').onclick=theme;$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'Light':'Dark';
$('#browse-toggle').onclick=()=>{let open=$('#browse-list').classList.toggle('show');$('#browse-toggle').setAttribute('aria-expanded',String(open));$('#results').classList.remove('show')};document.addEventListener('click',e=>{let f=e.target.closest('[data-focus]');if(f)focus(document.getElementById(f.dataset.focus));let b=e.target.closest('[data-branch]');if(b){detailed();let el=document.getElementById(b.dataset.branch);let bb=bounds(el);move(45-bb.left*.65,125-bb.top*.65,.65);$('#crumb').textContent=el.querySelector('strong').textContent;$('#browse-list').classList.remove('show');$('#browse-toggle').setAttribute('aria-expanded','false')}if(!e.target.closest('#browse')){$('#browse-list').classList.remove('show');$('#browse-toggle').setAttribute('aria-expanded','false')}if(!e.target.closest('.search-wrap'))$('#results').classList.remove('show');let p=e.target.closest('[data-play],[data-details]');if(p)openViewer(p.dataset.play||p.dataset.details,!!p.dataset.play)});
let matches=[],active=0;function choose(i){let m=matches[i];if(!m)return;focus(document.getElementById(m.id));$('#results').classList.remove('show');$('#search').blur()}function refreshSearch(){let q=$('#search').value.trim().toLowerCase();all('.match').forEach(e=>e.classList.remove('match'));if(!q){$('#results').classList.remove('show');return}matches=searchItems.filter(i=>{if(activeBatch){if(i.key){if(accountBatch.get(i.key)?.id!==activeBatch)return false}else{const el=document.getElementById(i.id);if(!el||el.id==='nb'||el.classList.contains('batch-empty'))return false}}return q.split(/\s+/).every(w=>i.text.includes(w))}).slice(0,60);active=0;$('#results').innerHTML=matches.length?matches.map((m,i)=>`<button data-result="${i}" class="${i===0?'active':''}">${esc(m.label)}<small>${esc(m.type)}</small></button>`).join(''):'<p>No matching product or account.</p>';$('#results').classList.add('show');matches.filter(m=>m.key).forEach(m=>document.getElementById(m.id).classList.add('match'))}$('#search').addEventListener('input',refreshSearch);$('#results').onclick=e=>{let b=e.target.closest('[data-result]');if(b)choose(Number(b.dataset.result))};$('#search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();choose(active)}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();active=Math.max(0,Math.min(matches.length-1,active+(e.key==='ArrowDown'?1:-1)));all('#results button').forEach((b,i)=>b.classList.toggle('active',i===active));$('#results button.active')?.scrollIntoView({block:'nearest'})}if(e.key==='Escape'){$('#search').value='';$('#search').dispatchEvent(new Event('input'));$('#search').blur()}};
function openViewer(key,autoplay){syncBatchCursor(key);let a=acc.get(key);selected=a;lastFocus=document.activeElement;$('#modal-title').textContent=a.platform==='Facebook'?a.name:'@'+a.handle;$('#modal-subtitle').textContent=a.treeProductTitle+' → '+a.treeVariant;$('#player').innerHTML=a.media?`<video controls playsinline preload="metadata" poster="${esc(a.poster)}" src="${esc(a.media)}" aria-label="${esc(a.name||a.handle)} full video"></video>`:`<div class="unavailable"><h3>${a.video?'Source video available':'Video unavailable'}</h3><p>${esc(a.note)}</p><a href="${esc(a.video?.url||a.sourceUrl)}" target="_blank" rel="noopener noreferrer">${a.video?'Watch original video':'Open source account'} ↗</a></div>`;$('#info').innerHTML=`<span class="category-tag">${esc(a.group)}</span>${accountBatch.has(key)?`<span class="detail-batch">Batch ${accountBatch.get(key).number} · ${batchDate(accountBatch.get(key))}</span>`:''}<h3>${esc(a.treeVariant)}</h3><div class="tags">${esc([...(a.niches||[]),...(a.occasions||[])].filter((x,i,ar)=>ar.indexOf(x)===i).join(' · '))}</div><a class="link" href="${esc(a.sourceUrl)}" target="_blank" rel="noopener noreferrer">Open ${esc(a.platform)} account ↗</a>${a.video?`<a class="link" href="${esc(a.video.url)}" target="_blank" rel="noopener noreferrer">Open original video ↗</a>`:''}<dl><div><dt>Followers${a.followersApproximate?' (rounded)':''}</dt><dd>${precise(a.followers)}</dd></div><div><dt>${a.countLabel||'Videos'}</dt><dd>${precise(a.videoCount)}</dd></div>${a.performance?`<div><dt>${a.performance.eligible?'Average views · latest '+a.performance.sampleCount+' in run':'Current-run average'}${a.performance.viewsApproximate?' (approx.)':''}</dt><dd>${a.performance.eligible?precise(Math.round(a.performance.averageViews)):'Unverified'}</dd></div>${a.performance.eligible&&a.performance.sampleCount<20?`<div><dt>Sample</dt><dd>${a.performance.sampleCount}/20 videos in this run; small sample</dd></div>`:''}`:''}<div><dt>${a.latestRun?.status==='review'?'Latest preview views':'Best observed in run'}${a.video?.viewsApproximate?' (rounded)':''}</dt><dd>${precise(a.video?.views)}</dd></div>${a.video?.likes!=null?`<div><dt>Likes</dt><dd>${precise(a.video.likes)}</dd></div>`:''}${a.video?.comments!=null?`<div><dt>Comments</dt><dd>${precise(a.video.comments)}</dd></div>`:''}${a.media?`<div><dt>Full duration</dt><dd>${a.duration.toFixed(2)} s</dd></div><div><dt>Audio</dt><dd>${a.audioTracks?'Included':'None in source'}</dd></div>`:''}</dl>${a.note?`<p>${esc(a.note)}</p>`:''}${a.also?.length?`<p>Also seen: ${esc(a.also.join(', '))}</p>`:''}<details><summary>Evidence & coverage</summary><p>${esc(a.coverage)}. ${esc(a.coverageNote)}</p><p>Count: ${esc(a.countScope)}.</p><p>${a.latestRun?.status==='review'?"Recent products are mixed or ambiguous. The preview is the latest observed video, not a verified winner.":"Featured video: highest observed views among the identified videos of this product run. Public history may be incomplete."}</p>${a.performance?`<p>Performance uses followers and the mean views of the newest ${a.performance.sampleCount} videos in the current product run, ordered by publication date (or a verified chronological profile grid when dates are unavailable). Followers are account-wide and may have been earned on older products. ${a.performance.viewsApproximate?"Some source counts are rounded.":""} ${a.performance.eligible?"":"Excluded from the ranking until its sample can be verified."}</p>`:""}<p>Product reviewed ${esc(a.productCheckedAt)}. Metrics collected ${esc(a.metricsCheckedAt)}.</p><code>${esc(a.mediaEvidence||a.evidence)}</code></details>`;viewer.showModal();if(autoplay&&a.media){const v=$('#player video');v.play().catch(()=>{});v.addEventListener('error',()=>{let n=document.createElement('p');n.className='unavailable';n.textContent='The local video could not be loaded. Open its original source from the details.';$('#player').append(n)})}}
