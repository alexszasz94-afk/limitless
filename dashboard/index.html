<title>LIMITLESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: glass command rail on the left (bottom dock on phones) + module stage; the Brain opens with a live 3D neural core. Dark-first. */
:root{
  --void:#05060d; --deck:#0b0e1d; --deck-2:#11152b; --edge:#20274a; --text:#eef0ff; --dim:#8a92c4;
  --ion:#5de4ff; --plasma:#b48cff; --flare:#ff7ad9; --ion-soft:rgba(93,228,255,.12); --plasma-soft:rgba(180,140,255,.14);
  --ok:#43e6a0; --ok-soft:rgba(67,230,160,.13); --warn:#ffc65c; --warn-soft:rgba(255,198,92,.13); --bad:#ff6b8b; --bad-soft:rgba(255,107,139,.13);
  --glass:rgba(17,21,43,.62); --grid:rgba(93,228,255,.06);
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Sora",system-ui,sans-serif; --f-data:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --void:#eceefb; --deck:#ffffff; --deck-2:#f3f4fd; --edge:#d7daf1; --text:#11142f; --dim:#5a618f;
  --ion:#0086b0; --plasma:#6a3fd6; --flare:#c2268f; --ion-soft:rgba(0,134,176,.10); --plasma-soft:rgba(106,63,214,.10);
  --ok:#0f8f5c; --ok-soft:rgba(15,143,92,.12); --warn:#a76a00; --warn-soft:rgba(167,106,0,.12); --bad:#c42b4f; --bad-soft:rgba(196,43,79,.10);
  --glass:rgba(255,255,255,.72); --grid:rgba(0,134,176,.07); color-scheme:light}}
:root[data-theme="light"]{
  --void:#eceefb; --deck:#ffffff; --deck-2:#f3f4fd; --edge:#d7daf1; --text:#11142f; --dim:#5a618f;
  --ion:#0086b0; --plasma:#6a3fd6; --flare:#c2268f; --ion-soft:rgba(0,134,176,.10); --plasma-soft:rgba(106,63,214,.10);
  --ok:#0f8f5c; --ok-soft:rgba(15,143,92,.12); --warn:#a76a00; --warn-soft:rgba(167,106,0,.12); --bad:#c42b4f; --bad-soft:rgba(196,43,79,.10);
  --glass:rgba(255,255,255,.72); --grid:rgba(0,134,176,.07); color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1100px 620px at 88% -12%,var(--plasma-soft),transparent 60%),radial-gradient(900px 520px at -8% 108%,var(--ion-soft),transparent 60%),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;border-right:1px solid var(--edge);display:flex;flex-direction:column;gap:3px;background:var(--glass);backdrop-filter:blur(16px) saturate(140%)}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.2em;padding:4px 10px 4px}
.brand b{background:linear-gradient(90deg,var(--ion),var(--plasma),var(--flare));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:var(--f-data);font-size:10.5px;letter-spacing:.18em;color:var(--dim);padding:0 10px 18px;text-transform:uppercase}
nav.rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--dim);text-decoration:none;font-size:14px;font-weight:500;transition:background .2s,color .2s}
nav.rail a:hover{color:var(--text);background:var(--deck-2)}
nav.rail a[aria-current="page"]{color:var(--text);background:linear-gradient(90deg,var(--ion-soft),transparent);box-shadow:inset 2px 0 0 var(--ion)}
nav.rail a i{font-style:normal;font-family:var(--f-data);font-size:10.5px;width:22px;color:var(--ion)}
nav.rail .sp{flex:1}
.who{font-size:12px;color:var(--dim);padding:10px;border-top:1px solid var(--edge);display:flex;gap:8px;align-items:center}
.who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}
main{padding-inline:30px;padding-block:26px 96px;max-width:1260px;width:100%;display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,34px);margin:0;letter-spacing:.01em;text-wrap:balance}
.kicker{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ion)}
.sub{color:var(--dim);font-size:13.5px}
h2{font-family:var(--f-data);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:600}
.panel{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:18px;padding:18px;min-width:0}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
/* brain */
.brain{position:relative;overflow:hidden;padding:0;height:min(460px,62vw);min-height:320px;border-radius:22px;border:1px solid var(--edge);
  background:radial-gradient(60% 80% at 65% 50%,var(--plasma-soft),transparent 70%),var(--deck)}
.brain::after{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;background:linear-gradient(120deg,var(--ion),transparent 30%,transparent 70%,var(--plasma));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}
.brain canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.brain .ov{position:absolute;left:0;top:0;padding:22px 24px;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:400px}
.brain .ov b{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.6vw,28px);line-height:1.2}
.brain .ov .stats{display:flex;gap:18px;margin-top:6px;font-family:var(--f-data);font-size:12px;color:var(--dim)}
.brain .ov .stats b{font-size:20px;color:var(--text);display:block;font-family:var(--f-data)}
.brain .hint{position:absolute;right:16px;bottom:12px;font-family:var(--f-data);font-size:11px;color:var(--dim)}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.agent{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--edge);border-radius:14px;background:var(--glass);min-width:0;transition:border-color .2s,transform .2s}
.agent:hover{border-color:var(--ion);transform:translateY(-1px)}
.agent .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--plasma)}
.agent .dot.on{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.agent .dot.wait{background:var(--warn)}
.agent b{font-size:14px;display:block}
.agent span{font-size:12.5px;color:var(--dim);overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--edge);border-radius:16px;background:var(--glass);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--ion),var(--plasma));opacity:.8}
.kpi small{color:var(--dim);font-size:12.5px}
.kpi b{font-family:var(--f-data);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--edge);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ion),var(--plasma))}
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;position:relative}
.st{padding:10px 6px;border:1px solid var(--edge);border-radius:12px;text-align:center;background:var(--glass);min-width:0}
.st b{display:block;font-family:var(--f-data);font-size:20px}
.st span{font-size:11px;color:var(--dim);overflow-wrap:anywhere;font-family:var(--f-data);letter-spacing:.04em}
.st.on{border-color:var(--ion);background:var(--ion-soft);box-shadow:0 0 24px -10px var(--ion)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.card{border:1px solid var(--edge);border-radius:16px;background:var(--glass);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--dim)}
.row b{color:var(--text);font-family:var(--f-data);font-weight:400}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;font-family:var(--f-data);letter-spacing:.03em}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-ion{background:var(--ion-soft);color:var(--ion)}.c-pl{background:var(--plasma-soft);color:var(--plasma)}
.score{display:flex;align-items:center;gap:10px}.score .bar{flex:1;margin:0}.score b{font-family:var(--f-data);font-size:22px;min-width:3ch;text-align:right}
.crit{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.crit button{height:26px;border-radius:7px;border:1px solid var(--edge);background:transparent;color:var(--dim);font-family:var(--f-data);font-size:11px;cursor:pointer;padding:0}
.crit button.y{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.crit button.n{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.crit button:disabled{cursor:default}
.tbl{overflow-x:auto;border:1px solid var(--edge);border-radius:16px;background:var(--glass)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--edge);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;font-family:var(--f-data)}
td.n{font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
a{color:var(--ion)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--deck-2);border:1px solid var(--edge);border-radius:10px;padding:9px 10px;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--ion);background:var(--ion-soft);color:var(--text)}
.btn.solid{background:linear-gradient(90deg,var(--ion),var(--plasma));color:#05060d;border:0;box-shadow:0 8px 28px -10px var(--plasma)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--dim);font-size:13px}
.empty{border:1px dashed var(--edge);border-radius:16px;padding:22px;color:var(--dim);font-size:14px;display:flex;flex-direction:column;gap:6px;background:var(--glass)}
.empty b{color:var(--text);font-family:var(--f-display);font-weight:600;font-size:15px}
.ai{border:1px solid var(--plasma);background:var(--plasma-soft);border-radius:12px;padding:12px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mod{border:1px solid var(--edge);border-radius:16px;padding:16px;background:var(--glass);display:flex;flex-direction:column;gap:6px}
.mod b{font-family:var(--f-display);font-weight:600;font-size:15px}
.rules{padding-left:18px;margin:0;columns:2 380px;column-gap:28px}
.rules li{margin-bottom:8px;font-size:14px;break-inside:avoid}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--edge);z-index:5}
  nav.rail .brand,nav.rail .tag,nav.rail .sp,.who{display:none}
  nav.rail a{flex:none;flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
  main{padding-inline:16px;padding-block:18px 116px}
  .flow{grid-template-columns:repeat(4,minmax(0,1fr))}
  .brain .ov{max-width:100%}
}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.cat{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.cathead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-top:6px;border-top:1px solid var(--edge)}
.catt{font-family:var(--f-display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--text);margin:0}
.prodblock{border:1px solid var(--edge);border-radius:18px;background:var(--glass);padding:14px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.ph h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px}
.ph .dot{width:8px;height:8px;border-radius:50%;background:var(--ion);box-shadow:0 0 10px var(--ion)}
.ph .btn{margin-left:auto;padding:6px 12px;font-size:12.5px}
.vrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.step::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:linear-gradient(var(--ion),var(--plasma));opacity:.4}
.step:last-child::before{display:none}
.step .num{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;border:1px solid var(--ion);background:var(--ion-soft);color:var(--text)}
.step.done .num{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step .sb{border:1px solid var(--edge);border-radius:16px;background:var(--glass);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.step h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px}
.step p{margin:0;color:var(--dim);max-width:70ch}
.step a.btn{text-decoration:none}
.calcout{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);font-size:14px}
.calcout.good{border-color:var(--ok);background:var(--ok-soft)}.calcout.bad{border-color:var(--bad);background:var(--bad-soft)}
.take summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:12px}
.take summary::-webkit-details-marker{display:none}
.take dl{margin:6px 0 0;display:grid;gap:2px;font-size:12px}
.take dt{color:var(--ion);font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.take dd{margin:0;color:var(--text)}
.toplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.topc{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;border:1px solid var(--edge);border-radius:18px;background:var(--glass);padding:16px}
.topc.start{border-color:var(--ion)}.topc.ok{border-color:var(--ok);box-shadow:0 0 30px -16px var(--ok)}
.topc .rk{font-family:var(--f-display);font-weight:800;font-size:30px;background:linear-gradient(180deg,var(--ion),var(--plasma));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.topc h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.topc p{margin:4px 0;max-width:80ch}
.topc a.btn{text-decoration:none}
.tb{display:flex;flex-direction:column;gap:6px;min-width:0}
.lane{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;border:1px solid var(--edge);border-radius:20px;background:var(--glass);padding:14px;min-width:0}
.lside{display:flex;flex-direction:column;gap:8px;min-width:0}
.lside h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px}
.lside .cap{margin:0;font-size:13px;color:var(--text)}
.lside .vid{max-width:220px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12px}.meta dt{color:var(--dim)}.meta dd{margin:0;text-align:right;font-family:var(--f-data)}
.lgroups{display:flex;flex-direction:column;gap:12px;min-width:0}
.ghead{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.gdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.shot{flex:none;width:280px;border:1px solid var(--edge);border-top:3px solid var(--gc);border-radius:14px;background:var(--deck);padding:12px;display:flex;flex-direction:column;gap:6px}
.shot h4{margin:0;font-size:14px}.shot p{margin:0;font-size:12.5px}
.sid{font-family:var(--f-data);font-size:12px;color:var(--ion)}
.mono{font-family:var(--f-data);font-size:11px}
.pr summary{cursor:pointer;font-size:12.5px;color:var(--ion)}
.pblk{border-top:1px solid var(--edge);padding-top:6px;margin-top:6px}
.pblk pre{white-space:pre-wrap;font-family:var(--f-data);font-size:11px;max-height:220px;overflow:auto;background:var(--deck-2);border-radius:8px;padding:8px;margin:4px 0 0}
@media (max-width:860px){.lane{grid-template-columns:1fr}.lside .vid{max-width:200px}}
.insight{border:1px solid var(--plasma);border-radius:12px;background:var(--plasma-soft);padding:10px 12px;margin-bottom:10px}
.insight summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.insight summary::-webkit-details-marker{display:none}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px}
.ins h4{margin:0 0 4px;font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--plasma)}
.ins p,.ins li{font-size:13.5px;margin:0 0 4px}.ins ul{margin:0;padding-left:18px}
.broll{margin-top:14px;border-top:1px solid var(--edge);padding-top:10px}.broll h4{margin:0 0 4px;font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--plasma)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:8px 0}.shot{background:var(--deck-2);border:1px solid var(--edge);border-radius:12px;padding:10px}.shot p{font-size:13px;margin:6px 0}.shot video{width:100%;max-height:300px;border-radius:8px;background:#000}
.exact{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:10px 0 8px;font-size:14px}
.tog{flex-direction:row;align-items:center;gap:6px;color:var(--text);font-size:13px}
.verdict{font-size:13px;border-radius:10px;padding:8px 12px;margin-bottom:12px;border:1px solid var(--edge)}
.verdict.v-ok{border-color:var(--ok);background:var(--ok-soft)}.verdict.v-warn{border-color:var(--warn);background:var(--warn-soft)}.verdict.v-bad{border-color:var(--bad);background:var(--bad-soft)}
.link{font:inherit;font-size:12.5px;background:none;border:0;color:var(--ion);cursor:pointer;text-decoration:underline;padding:0 0 0 6px}
.acct{flex:none;width:200px;scroll-snap-align:start;border:1px solid var(--edge);border-radius:14px;background:var(--deck);padding:10px;display:flex;flex-direction:column;gap:6px}
.acct header{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.acct header a{color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .vt{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid{position:relative;aspect-ratio:9/16;width:100%;max-width:100%;border-radius:10px;border:0;background:#0a0c18 center/cover no-repeat;cursor:pointer;padding:0;overflow:hidden;display:block}
.vid .wo{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--dim)}
.vid.none{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;cursor:default}

<script>
const CRIT=["Proven demand (≥100k views in 24 h or long-running paid ads)","≤ 4 active organic competitors","Price ≥ $38.99","≥ $2,000 per 1M views (test order)","US buyers with money (25+)","Understood in 1–3 seconds","We can do it better than competitors","Renders faithfully with our tools","Reliable US shipping, low chargeback risk","Fits the season / evergreen"];

const S={db:null,user:null,sample:null,write:true,products:[],virals:[],inbox:[],cfg:null,agents:{},route:"brain",launch:{},ai:{},finder:[],strategy:null,fq:"",fg:"",posters:{},takes:{},top:null,fmedia:{},boards:[],board:"",lanes:{},insights:{},broll:{},rows:null,ugcOnly:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(n==null||n==="")?"–":Number(n).toLocaleString("en-US");

const vel=(views,h)=>Math.round(views/Math.max(Number(h)||1,1)*24);

function scor(p){
  const m=p.metrici||{},c=p.criterii||{};
  if(Object.values(c).some(v=>v===false)) return [0,"picat"];
  const usd=Math.min((m.usd1m||0)/10000,1),vit=Math.min((p.viteza_max||0)/300000,1);
  const conc=m.concurenti==null?0:Math.max(0,1-m.concurenti/5),marja=Math.min((m.marja||0)/.7,1),usor=(m.usor||0)/10;
  const s=Math.round(100*(.4*usd+.2*vit+.15*conc+.15*marja+.1*usor));
  return [s,CRIT.every((_,i)=>c[i+1]===true)?"trece":"în evaluare"];
}
function autoCrit(p){const m=p.metrici||{},c={...(p.criterii||{})};
  if(m.pret!=null)c[3]=Number(m.pret)>=38.99;
  if(m.concurenti!=null)c[2]=Number(m.concurenti)<=4;
  if(m.usd1m!=null)c[4]=Number(m.usd1m)>=2000;
  return c;}
const costVideo=()=>S.cfg?.cost_video_est??172;
const buget=()=>S.cfg?.buget?.credits_per_day??2000;

/* ---------- views ---------- */
function demoBanner(){return S.cfg?.demo?`<div class="banner"><span><b>Sample data.</b> These products and virals are made up so you can see the platform working.</span>${S.write?`<button class="btn" data-act="cleardemo">Clear samples</button>`:""}</div>`:""}
function vBrain(){
  const dov=S.virals.filter(v=>v.dovedit).length, work=S.virals.filter(v=>["planificat","produs","verificat","montat"].includes(v.stadiu)).length;
  const plan=S.virals.filter(v=>v.stadiu==="planificat").reduce((a,v)=>a+(v.credite_est||0),0);
  const pct=Math.min(100,Math.round(100*plan/buget()));
  const flow=STADII.map(s=>{const n=S.virals.filter(v=>v.stadiu===s).length;return `<div class="st${n?" on":""}"><b>${n}</b><span>${SE[s]}</span></div>`}).join("");
  const ag=AGENTI.map(([k,n,d])=>{const a=S.agents[k]||{};const st=a.stare||"în construcție";const cls=st==="activ"?"on":st==="așteaptă"?"wait":"";

  const active=AGENTI.filter(([k])=>S.agents[k]?.stare==="activ").length;
  return `${demoBanner()}
  <div class="top"><div><div class="kicker">LIMITLESS · brain</div><h1>Everything happening right now</h1></div><div class="sub">target $5,000,000 · Genjutsu motion control · Seedance 2.5 · GPT Image 2.5</div></div>

      <div class="stats"><span><b>${active}/9</b>agents live</span><span><b>${dov}</b>proven virals</span><span><b>${work}</b>in production</span></div></div>
    <span class="hint">drag to rotate</span></section>

    <div class="kpi"><small>Proven virals</small><b>${dov}</b><small>≥100,000 views in 24 h</small></div>
    <div class="kpi"><small>Videos in production</small><b>${work}</b><small>planned → edited</small></div>
    <div class="kpi"><small>Credits scheduled today</small><b>${fmt(plan)}</b><div class="bar"><i style="width:${pct}%"></i></div><small>of ${fmt(buget())} daily budget</small></div>
  </section>
  <section><h2>Agents</h2><div class="agents">${ag}</div></section>
  <section><h2>Video pipeline</h2><div class="flow">${flow}</div></section>
  <section><h2>Latest requests</h2>${S.inbox.length?inboxList(S.inbox.slice(0,4)):`<div class="empty"><b>No requests yet</b>Write one in “Ask Claude”. I pick them up when you tell me “requests” in chat.</div>`}</section>`;
}
function vProducts(){
  const cards=[...S.products].sort((a,b)=>scor(b)[0]-scor(a)[0]).map(p=>{
    const [s,ver]=scor(p),m=p.metrici||{},c=p.criterii||{},k=ver==="trece"?"ok":ver==="picat"?"bad":"warn";
    const crit=CRIT.map((t,i)=>{const v=c[i+1];return `<button ${S.write?"":"disabled"} class="${v===true?"y":v===false?"n":""}" data-act="crit" data-id="${p._id}" data-i="${i+1}" title="${i+1}. ${esc(t)}" aria-label="Check ${i+1}: ${esc(t)} — ${v===true?"pass":v===false?"fail":"unchecked"}">${i+1}</button>`}).join("");

      ${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">Product page</a>`:""}
      ${S.sample?`<div class="row"><button class="btn" data-act="ai" data-id="${p._id}">Analyze with Claude</button></div>`:""}
      ${ai?`<div class="ai">${ai.html||esc(ai.text||"")}</div>`:""}
      ${p.idei?`<div class="ai"><b>Saved ideas</b>\n${esc(p.idei)}</div>`:""}

  return `<div class="top"><div><div class="kicker">01 · products</div><h1>What's worth running</h1></div><div class="sub">Tap a square to mark it: empty → pass → fail. One red stops the product.</div></div>
  ${S.write?`<section class="panel"><h2>Add a product</h2><form class="f" id="fProd">

    const b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height,m=b.width>420?3:8;
    el.classList.add("t3d");el.style.setProperty("--ry",((x-.5)*m).toFixed(2)+"deg");el.style.setProperty("--rx",((.5-y)*m).toFixed(2)+"deg");
    el.style.setProperty("--mx",(x*100).toFixed(1)+"%");el.style.setProperty("--my",(y*100).toFixed(1)+"%")},{passive:true});
  document.addEventListener("pointerleave",()=>{if(cur)reset(cur)},true);
  addEventListener("scroll",()=>{const b=document.querySelector(".brain");if(b){const k=Math.max(-1,Math.min(1,b.getBoundingClientRect().top/innerHeight));b.style.setProperty("--brx",(k*-6).toFixed(2)+"deg")}},{passive:true});}};
SPACE.start();TILT.on();
/* posters load only when a card scrolls near the screen */
const POST={io:null,init(){const v=document.getElementById("view");if(!v)return;
  this.io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){this.fill(e.target);this.io.unobserve(e.target)}}),{rootMargin:"600px 0px"}):null;
  let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;this.scan()})}).observe(v,{childList:true,subtree:true});this.scan()},
 fill(el){const k=el.dataset.poster||el.dataset.pk,u=S.posters[k];if(!u)return;if(el.tagName==="VIDEO")el.poster=u;else el.style.backgroundImage=`url(${u})`},
 scan(){document.querySelectorAll("#view [data-poster]:not([data-pd]),#view video[data-pk]:not([data-pd])").forEach(el=>{if(!S.posters[el.dataset.poster||el.dataset.pk])return;el.dataset.pd="1";if(this.io)this.io.observe(el);else this.fill(el)})}};
POST.init();

</script>
